<div class="admin-container">
  <div class="row">
    <!-- Liste des utilisateurs -->
    <div class="col-md-4">
      <h4>Utilisateurs</h4>
      <div class="list-group">
        <button *ngFor="let user of users"
                class="list-group-item list-group-item-action"
                [class.active]="selectedUserId === user.id"
                (click)="selectUser(user.id)">
          {{ user.prenom }} {{ user.nom }}
          <small class="text-muted d-block">{{ user.email }}</small>
        </button>
      </div>
    </div>

    <!-- Détails utilisateur sélectionné -->
    <div class="col-md-8" *ngIf="selectedUserId">
      <h4>Permissions de l'utilisateur</h4>

      <!-- Rôles -->
      <div class="card mb-3">
        <div class="card-header">Rôles assignés</div>
        <div class="card-body">
          <div *ngFor="let role of userRoles" class="badge bg-primary me-2 mb-2 p-2">
            {{ role.nom }}
            <button class="btn-close btn-close-white ms-2" (click)="removeRole(role.id)"></button>
          </div>
          <select class="form-select mt-2" (change)="assignRole($any($event.target).value)">
            <option value="">Ajouter un rôle...</option>
            <option *ngFor="let role of allRoles" [value]="role.id">{{ role.nom }}</option>
          </select>
        </div>
      </div>

      <!-- Permissions directes -->
      <div class="card mb-3">
        <div class="card-header">Permissions directes</div>
        <div class="card-body">
          <div class="row">
            <div *ngFor="let perm of allPermissions" class="col-md-6 mb-2">
              <div class="form-check">
                <input class="form-check-input" type="checkbox"
                       [checked]="userEffectivePermissions.includes(perm.code)"
                       (change)="togglePermission(perm.id, $any($event.target).checked)">
                <label class="form-check-label">{{ perm.libelle }} ({{ perm.code }})</label>
              </div>
            </div>
          </div>
          <button class="btn btn-outline-primary mt-2" (click)="grantAllPermissions()">
            Accorder tous
          </button>
        </div>
      </div>

      <!-- Accès Régions -->
      <div class="card mb-3">
        <div class="card-header">Accès Régions</div>
        <div class="card-body">
          <div class="row">
            <div *ngFor="let region of allRegions" class="col-md-4 mb-2">
              <div class="form-check">
                <input class="form-check-input" type="checkbox"
                       [checked]="hasRegionAccess(region.id)"
                       (change)="toggleRegion(region.id, $any($event.target).checked)">
                <label class="form-check-label">{{ region.nom }}</label>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Menus Gauche / Haut -->
      <div class="card">
        <div class="card-header">Visibilité des menus</div>
        <div class="card-body">
          <p><em>À implémenter : gestion des entrées du menu gauche/droite via permissions</em></p>
        </div>
      </div>
    </div>
  </div>
</div>
