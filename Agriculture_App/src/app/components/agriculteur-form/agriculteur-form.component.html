<div class="form-wrapper">
  <div class="card premium-card">

    <!-- HEADER -->
    <div class="card-header d-flex align-items-center gap-3">
      <div class="icon-box">
        <i class="bi" [ngClass]="isEditMode ? 'bi-pencil-square' : 'bi-person-plus-fill'"></i>
      </div>
      <h2 class="mb-0">{{ isEditMode ? 'Modifier' : 'Ajouter' }} un Agriculteur</h2>
    </div>

    <!-- BODY -->
    <div class="card-body">

      <!-- FORM -->
      <form (ngSubmit)="onSubmit()" #form="ngForm">

        <!-- Nom -->
        <div class="floating-group">
          <input type="text" name="nom" [(ngModel)]="formData.nom" required>
          <label>Nom</label>
        </div>

        <!-- Prénom -->
        <div class="floating-group">
          <input type="text" name="prenom" [(ngModel)]="formData.prenom" required>
          <label>Prénom</label>
        </div>

        <!-- Téléphone -->
        <div class="floating-group">
          <input type="tel"
                 name="telephone"
                 [(ngModel)]="formData.telephone"
                 [pattern]="phonePattern"
                 (input)="autoSuggest()">
          <label>Téléphone</label>
        </div>

        <!-- IA opérateur -->
        <small *ngIf="formData.operateur">Opérateur: {{ formData.operateur }}</small>

        <!-- Localisation -->
        <div class="floating-group">
          <input type="text"
                 name="localisation"
                 [(ngModel)]="formData.localisation"
                 (input)="onSearchLocation()">
          <label>Localisation</label>
        </div>

        <!-- Suggestions -->
        <ul class="suggestions" *ngIf="suggestions.length">
          <li *ngFor="let s of suggestions" (click)="selectLocation(s)">
            {{ s.display_name }}
          </li>
        </ul>

        <!-- ACTIONS -->
        <div class="actions d-flex justify-content-between mt-3">

          <!-- Annuler -->
          <button type="button" class="btn cancel" (click)="cancel()">
            <i class="bi bi-x-circle me-1"></i>
            Annuler
          </button>

          <!-- Ajouter / Modifier -->
          <button type="submit" class="btn submit" [disabled]="!form.valid">
            <i class="bi" [ngClass]="isEditMode ? 'bi-check-circle-fill' : 'bi-plus-circle-fill'"></i>
            {{ isEditMode ? 'Modifier' : 'Ajouter' }}
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
